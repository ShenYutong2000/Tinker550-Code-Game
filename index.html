<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="./src/styles/base.css"></head><body>
<title>Tinkercade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Press+Start+2P&family=Patrick+Hand&family=Nunito:wght@400;600;700&display=swap">
<link rel="stylesheet" href="./src/styles/app.css">

<div class="app side-open" id="app" data-tab="create">
  <div class="drawer-shade" data-act="side"></div>
  <aside class="side" id="side" aria-label="Projects and navigation">
    <div class="side-top">
      <div class="brand" aria-label="Tinkercade"><span class="bricks" data-bricks></span><span class="wm">Tinker<b>cade</b></span></div>
      <button class="ibtn" data-act="side" aria-label="Hide sidebar"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7.5 3.5v13" stroke="currentColor" stroke-width="1.5"/></svg></button>
    </div>
    <div id="sideBody" style="display:flex;flex-direction:column;flex:1;min-height:0;gap:2px"></div>
  </aside>

  <main class="main" aria-label="Chat">
    <div class="bar">
      <button class="ibtn open-side" data-act="side" aria-label="Show sidebar"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7.5 3.5v13" stroke="currentColor" stroke-width="1.5"/></svg></button>
      <span class="brand-mini"><span class="bricks" data-bricks></span></span>
      <input class="title-in" id="gameName" aria-label="Game name" maxlength="40" autocomplete="off" placeholder="New game">
      <span class="sp"></span>
      <button class="tbtn" data-act="board" title="Design map"><span>🗺️</span><span class="lbl">Design map</span></button>
      <button class="tbtn" data-act="save" title="Save"><svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 2.5h8.5l2.5 2.5v8.5h-11z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5 2.5v3.5h5.5V2.5M5 13.5v-4h6v4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><span class="lbl">Save</span></button>
    </div>
    <div class="feed" id="feed"><div class="thread"><div id="msgs" style="display:flex;flex-direction:column;gap:22px"></div><div class="live" id="live"></div></div></div>
    <div class="composer-wrap">
      <div class="composer"><textarea id="composer" rows="1" aria-label="Message your robot buddy"></textarea><button class="send" data-act="send" id="sendBtn" aria-label="Send"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 14V4M4.5 8.5 9 4l4.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
    </div>
  </main>

  <aside class="pane" id="pane" aria-label="Game preview">
    <div class="pane-h"><span>🎮</span><span class="t" id="paneTitle"></span><span class="v" id="paneVer"></span><span class="sp"></span>
      <button class="tbtn" data-act="rollback" id="rbBtn" title="Go back to the last version">↶ <span class="lbl">Undo</span></button>
      <button class="tbtn accent" data-act="export" title="Export HTML"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M2 13h12" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span class="lbl">Export HTML</span></button>
      <button class="ibtn" data-act="closepane" aria-label="Close game panel"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3 3 13" stroke="currentColor" stroke-width="1.8"/></svg></button>
    </div>
    <div class="pane-b">
      <div class="cab"><canvas id="cv" tabindex="0" aria-label="Playable game canvas. Click it, then use the keyboard or mouse"></canvas></div>
      <div class="legend" id="legend"></div>
    </div>
  </aside>

  <nav class="tabbar" id="tabbar" aria-label="Switch view">
    <button data-tab="create"><span>💬</span><span class="ti">CREATE</span></button>
    <button data-tab="preview"><span>🕹️</span><span class="ti">PREVIEW</span></button>
    <button data-act="board"><span>🗺️</span><span class="ti">MAP</span></button>
  </nav>
</div>
<div id="layer"></div>

<script>
if(location.protocol==="file:"&&!document.documentElement.hasAttribute("data-standalone-preview")){
  const filePreview=location.pathname.toLowerCase().replace(/\\/g,"/").endsWith("/dist/index.html")?"./standalone-preview.html":"./dist/standalone-preview.html";
  const notice=document.createElement("div");
  notice.setAttribute("role","alert");
  notice.style.cssText="position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:24px;background:#18141F;color:#EEEAF6;font:16px system-ui,sans-serif";
  notice.innerHTML=`<div style="max-width:520px"><h1 style="font-size:22px">请打开构建后的预览文件</h1><p>当前 index.html 是 Vite 源码入口，直接双击时浏览器无法加载模块。请先在项目目录运行 <code>npm run build</code>。</p><p><a href="${filePreview}" style="color:#FFD166">打开单文件预览</a></p></div>`;
  document.body.appendChild(notice);
}
</script>

<script type="module">
import "./src/game/engine.js";
import { exportStandaloneGame } from "./src/game/export.js";
import { COLS, COLMAP, CHAR_COL, MODES } from "./src/design/catalog.js";
import { sing, bestMatch, parseHero, parseAction } from "./src/design/parse.js";
import { optionsFor, questionFor, STEMS, COL_WORDS } from "./src/design/options.js";
import { createProject, restoreProject, createUIState, projectCharacters, isBuilt, buildProjectSpec, projectContext, updateAutomaticName } from "./src/state/project.js";
import { readBotName, saveBotName, readProjects, saveProject, clearSavedData, resetFromLocation } from "./src/state/storage.js";
(function(){
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let _id=Date.now()%100000; const uid=()=>"s"+(++_id);
const rot=()=>(Math.random()*5-2.5).toFixed(1)+"deg";
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
/* ?reset or #reset in the address wipes saved projects before anything loads */
resetFromLocation();
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;

/* robot avatar: round yellow toy-brick head (R3) */
const ROBOT=`<svg class="avatar" viewBox="0 0 120 120" aria-hidden="true"><rect x="34" y="12" width="18" height="14" rx="4" fill="#FFD166"/><rect x="68" y="12" width="18" height="14" rx="4" fill="#FFD166"/><rect x="18" y="22" width="84" height="80" rx="14" fill="#FFD166"/><rect x="18" y="90" width="84" height="12" rx="6" fill="#D9A13A"/><rect x="26" y="30" width="22" height="8" rx="4" fill="#FFE6A6"/><g class="eye"><rect x="35" y="48" width="15" height="18" rx="3" fill="#15102A"/><rect x="70" y="48" width="15" height="18" rx="3" fill="#15102A"/><rect x="39" y="51" width="5" height="5" fill="#fff"/><rect x="74" y="51" width="5" height="5" fill="#fff"/></g><ellipse cx="30" cy="75" rx="7" ry="4.5" fill="#FF8A5C" opacity=".8"/><ellipse cx="90" cy="75" rx="7" ry="4.5" fill="#FF8A5C" opacity=".8"/><path d="M49 74 Q60 85 71 74" stroke="#15102A" stroke-width="6" fill="none" stroke-linecap="round"/></svg>`;
/* brand logo: arcade token stamped with a toy brick; hops and now and then flips */
const LOGO=`<svg viewBox="0 0 100 100" width="36" height="36" aria-hidden="true"><g class="pz">
<circle cx="50" cy="54" r="42" fill="#D9A13A"/><circle cx="50" cy="50" r="42" fill="#FFD166"/><circle cx="50" cy="50" r="33" fill="none" stroke="#D9A13A" stroke-width="3" stroke-dasharray="4 5"/>
<rect x="35" y="30" width="11" height="9" rx="3" fill="#FF6B35"/><rect x="54" y="30" width="11" height="9" rx="3" fill="#FF6B35"/>
<rect x="28" y="36" width="44" height="32" rx="9" fill="#C9441A"/><rect x="28" y="36" width="44" height="25" rx="9" fill="#FF6B35"/><rect x="34" y="42" width="12" height="4.5" rx="2.25" fill="#FFB08F"/>
<path d="M24 26 Q30 18 40 14" stroke="#FFF1C9" stroke-width="4" fill="none" stroke-linecap="round" opacity=".8"/></g></svg>`;
const X_ICON=`<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3 3 13" stroke="currentColor" stroke-width="1.8"/></svg>`;

/* ---------- state ---------- */
const botName=()=>P.botName||readBotName()||"Robo";
function fresh(){return createProject(readBotName()||"");}
let P=fresh();
const UI=createUIState(innerWidth);
const chars=()=>projectCharacters(P);
const built=id=>isBuilt(P,id);
const buildSpec=includeNew=>buildProjectSpec(P,includeNew);
const ctx=()=>projectContext(P);
const autoName=()=>updateAutomaticName(P);

/* ---------- conversation: one message at a time ---------- */
const Q=[];let pumping=false;
function say(html,who="sprout"){Q.push({who,html});pump();}
function msgNode(m,anim){
  const d=document.createElement("div");
  d.className="msg "+(m.who==="kid"?"kid":"sprout")+(anim?" enter":"");
  d.innerHTML=m.who==="kid"?`<div class="body">${m.html}</div>`:`${ROBOT}<div class="body">${m.html}</div>`;
  return d;
}
function scrollDown(){const f=$("#feed");f.scrollTop=f.scrollHeight;}
async function pump(){
  if(pumping)return;pumping=true;renderLive();
  while(Q.length){
    const m=Q.shift();
    if(m.who==="sprout"){
      showTyping(true);
      const len=m.html.replace(/<[^>]+>/g,"").length;
      await sleep(reduced?250:Math.min(1700,520+len*16));
      showTyping(false);
    } else await sleep(120);
    P.chat.push(m);$("#msgs").appendChild(msgNode(m,true));scrollDown();
    if(Q.length&&Q[0].who==="sprout")await sleep(260);
  }
  pumping=false;renderLive(true);runOnboarding();
}
function showTyping(on){
  const live=$("#live");
  if(on){live.className="live";live.innerHTML=`<div class="msg" style="margin-left:-42px">${ROBOT}<div class="typing" aria-label="${esc(botName())} is typing"><i></i><i></i><i></i><span class="who">${esc(botName())} is typing…</span></div></div>`;}
  else live.innerHTML="";
  scrollDown();
}
function renderMsgs(){const box=$("#msgs");box.innerHTML="";P.chat.forEach(m=>box.appendChild(msgNode(m,false)));scrollDown();}

/* ---------- widgets that live under Sprout's latest message ---------- */
function chipRow(list,target,label){return `<div class="chips">${label?`<span class="lab">${label}</span>`:""}${list.map(x=>`<button class="chip" data-fill="${target}" data-val="${esc(x)}">${esc(x)}</button>`).join("")}</div>`;}
function widgetHTML(){
  const newCount=P.stickers.filter(s=>s.status==="new").length;
  switch(P.phase){
    case "naming":return chipRow(["Bolt","Sparky","Pixel","Gizmo","Beep"],"composer","Try a name");
    case "opening":return `<div class="card"><div class="blank"><span>I want to make a game about</span><input id="inWho" placeholder="who?" aria-label="Who" autocomplete="off"><input id="inDo" placeholder="doing what?" aria-label="Doing what" autocomplete="off"></div>
      ${chipRow(["a cat","a robot","a rocket","a fish","a dinosaur"],"inWho","Who")}${chipRow(["catching stars","dodging meteors","jumping over cacti","popping balloons","finding gems in the sea"],"inDo","Doing what")}
      <div class="row"><button class="btn" data-act="opening">Got it!</button></div></div>`;
    case "newchar":return `${chipRow(["a dog","a penguin","an alien","a panda","a fox"],"composer","Try")}<div class="row"><button class="link" data-act="cancel">Never mind</button></div>`;
    case "choice":{const c=UI.choice;return `<div class="chips"><span class="lab">You could say</span>${c.options.map((o,i)=>`<button class="chip opt" data-pick="${i}">${o.pic} ${esc(o.t)}${c.predicted===i?'<span class="tag">your guess</span>':""}</button>`).join("")}</div><div class="row"><button class="link" data-act="cancel">Try something else</button></div>`;}
    case "confirm":return newCount?`<div class="row"><button class="btn" data-act="board">🗺️ Open my board</button><span class="hint">${newCount} red ${newCount>1?"notes":"note"} waiting for you</span></div>`
      :`<div class="row"><button class="btn" data-act="generate">Make my game!</button><button class="btn soft" data-act="board">Look at the board</button></div>`;
    case "generating":{const g=UI.gen;if(!g)return "";const locked=g.guess!==undefined;
      return `<div class="card"><div class="shimmer ${g.done?"done":""}" aria-hidden="true"></div><div class="gen-status">${esc(g.status)}</div>
      ${locked?`<div class="hint">Guess saved! When you play, see if you were right.</div>`:`<div class="gen-pick">
      <div class="pchoices">${g.P.a.map((a,i)=>`<button class="pchoice ${g.sel===i?"picked":""}" data-p="${i}" aria-pressed="${g.sel===i}"><span class="pic">${a.pic}</span><span>${esc(a.t)}</span></button>`).join("")}</div>
      <div class="own"><input id="guessIn" value="${esc(g.typed||"")}" placeholder="or write your own guess…" aria-label="Write your own guess" autocomplete="off"><button class="btn" data-act="guess" ${g.sel!=null||(g.typed||"").trim()?"":"disabled"}>I think so!</button></div>
      </div>`}</div>`;}
    case "playtest":{const v=P.versions[P.versions.length-1];if(!v)return "";
      if(!UI.paneOpen)return `<button class="art play" data-act="openpane"><span class="ic">🎮</span><span><span class="t">${esc(P.name||"My game")}</span><br><span class="s">Click to play</span></span><span class="go">▶</span></button>`;
      return UI.asked?"":`<div class="hint" style="padding:2px 0">🎮 Playing…</div>`;}
    case "directions":{const v=P.versions[P.versions.length-1],typed=UI.ownText||"";
      return `${!UI.paneOpen&&v?`<button class="art" data-act="openpane"><span class="ic">🎮</span><span><span class="t">${esc(P.name||"My game")}</span><br><span class="s">Click to open the game</span></span></button>`:""}
      <div class="pick">
      <div class="dirs">${directions().map(x=>{const key=x.sel||x.col,on=P.saved.some(s=>s.col===x.col&&s.q===x.q),sel=UI.sel===key;return `<div class="dir ${sel?"sel":""}"><button class="dir-go" data-sel="${key}" aria-pressed="${sel}"><span class="q">${esc(x.q)}</span></button><button class="star ${on?"on":""}" data-star="${x.col}" data-q="${esc(x.q)}" aria-pressed="${on}" aria-label="${on?"Remove from My game ideas":"Save to My game ideas for later"}" title="${on?"Remove from My game ideas":"Save to My game ideas for later"}">${on?"★":"☆"}</button></div>`;}).join("")}</div>
      ${P.saved.length?`<div class="chips"><span class="lab">⭐ My game ideas</span>${P.saved.map(s=>`<button class="chip ${UI.sel===s.col?"on":""}" data-sel="${s.col}">${esc(s.q)}</button>`).join("")}</div>`:""}
      <div class="own"><input id="ownIdea" value="${esc(typed)}" placeholder="or write your own idea…" aria-label="Write your own idea" autocomplete="off"><button class="btn" data-act="pickgo" ${UI.sel||typed.trim()?"":"disabled"}>This one!</button></div>
      </div>`;}
    case "concept":return `<div class="row"><button class="btn" data-act="cdesign">${UI.concept&&UI.concept.text?"Put it in my game":"Keep designing it"}</button><button class="btn soft" data-act="cother">Look at something else</button></div>`;
  }
  return "";
}
function renderLive(animate){
  if(pumping)return;
  const live=$("#live");live.className="live"+(animate?" enter":"");live.innerHTML=widgetHTML();scrollDown();
  renderComposer();
  if(P.phase==="generating"&&UI.gen&&UI.gen.guess===undefined&&!P.seen.includes("predict")&&!UI.onboardQ.includes("predict")){UI.onboardQ.push("predict");setTimeout(runOnboarding,400);}
  if(P.phase==="directions"&&!P.seen.includes("star")&&!UI.onboardQ.includes("star")&&!UI.boardOpen){UI.onboardQ.push("star");setTimeout(runOnboarding,500);}
}
function renderComposer(){
  const ta=$("#composer"),send=$("#sendBtn");
  const ph={naming:"Give your robot buddy a name…",opening:"Or just type: a cat catching stars",newchar:"Who is the new character?",choice:"Finish this sentence…",confirm:"First, confirm the red notes on the board…",generating:"Pick one above, or write your guess…",playtest:"What did you see?",directions:"Or write your own idea here…",concept:"Or write a different idea…"}[P.phase]||"";
  ta.placeholder=ph;
  const off=P.phase==="confirm"||P.phase==="generating"||P.phase==="reacting";
  ta.disabled=off;send.disabled=off;
}

/* ---------- sidebar / header / pane ---------- */
const allProjects=()=>readProjects();
function renderSide(){
  const ok=P.stickers.filter(s=>s.status==="ok"),lit=new Set(ok.map(s=>s.col));
  const keys=["character",...COLS.map(c=>c.key)];
  const list=allProjects();
  $("#sideBody").innerHTML=`
    <button class="sbtn new" data-act="new"><span class="plus">+</span>New project</button>
    <button class="sbtn" data-act="board"><span>🗺️</span>Design map<span class="badge">${ok.length}</span></button>
    <div class="bot-row">${ROBOT.replace('class="avatar"','class="avatar" style="width:22px;height:22px"')}<span>Buddy: <span class="nm">${esc(botName())}</span></span><button data-act="rename">Rename</button></div>
    <div class="scroll">
      <div class="sec">My projects</div>
      ${list.length?list.map(p=>{const cur=p.id===P.id,src=cur?P:p,h=(src.stickers||[]).find(s=>s.col==="character"),sv=src.saved||[],open=UI.expanded.has(p.id);
        return `<div class="proj-wrap ${cur?"on":""}"><div class="proj ${cur?"on":""}"><button class="tw" data-expand="${p.id}" aria-expanded="${open}" aria-label="${open?"Hide":"Show"} My game ideas">${open?"▾":"▸"}</button><button class="pn" data-open="${p.id}"><span class="em">${h?h.effect.char.e:"🧩"}</span><span class="n">${esc(src.name||"New game")}</span></button>${sv.length?`<span class="fav-ct" title="My game ideas">⭐${sv.length}</span>`:""}</div>
        ${open?`<div class="favs"><div class="favs-h">⭐ My game ideas</div>${sv.length?sv.map(s=>`<div class="saved-item"><button class="go" ${cur?`data-dir="${s.col}"`:`data-open="${p.id}"`}><span class="s">☆</span>${esc(s.q)}</button>${cur?`<button class="x" data-unstar="${s.col}" aria-label="Remove this idea">×</button>`:""}</div>`).join(""):`<div class="empty-note">Tap ☆ on one of ${esc(botName())}'s ideas to save it here for later.</div>`}</div>`:""}</div>`;}).join(""):`<div class="empty-note">No projects yet. Share your first idea and it will show up here.</div>`}
    </div>
    <button class="sbtn restart" data-act="restart">↺ Start over</button>`;
  $("#app").classList.toggle("side-closed",!UI.sideOpen);
}
function renderBar(){const gi=$("#gameName");if(document.activeElement!==gi)gi.value=P.name;gi.size=Math.max(10,(gi.value||"").length+2);}
function renderPane(){
  const app=$("#app"),v=P.versions[P.versions.length-1];
  app.classList.toggle("has-pane",!!v&&UI.paneOpen);
  if(!v)return;
  if(UI.reveal){const p=$("#pane");p.classList.remove("reveal");void p.offsetWidth;p.classList.add("reveal");UI.reveal=false;}
  const sp=v.spec,m=sp.mode,c=sp.control,two=sp.players===2;
  $("#paneTitle").textContent=P.name||"My game";$("#paneVer").textContent="v"+v.n;
  $("#rbBtn").disabled=P.versions.length<2;$("#rbBtn").title=P.versions.length<2?"No earlier version yet":"Go back to the last version";
  const keys=[];
  if(c!=="mouse")keys.push(m==="roam"?`<span class="key">←↑↓→</span> move`:m==="jump"?`<span class="key">SPACE</span> jump`:`<span class="key">← →</span> move`);
  if(c!=="keys")keys.push(m==="jump"?"🖱️ click to jump":m==="shoot"?"🖱️ move + click to shoot":"🖱️ follow the mouse");
  if(m==="shoot"&&c!=="mouse")keys.push(`<span class="key">SPACE</span> shoot`);
  if(two)keys.push(`P2 <span class="key">WASD</span>${m==="shoot"?` <span class="key">F</span>`:""}`);
  $("#legend").innerHTML=keys.join(" · ");
}
function renderTabs(){
  $("#app").dataset.tab=UI.tab;
  $("#tabbar").querySelectorAll("[data-tab]").forEach(b=>{b.classList.toggle("on",b.dataset.tab===UI.tab);if(b.dataset.tab==="preview")b.disabled=!P.versions.length;});
}
function render(){P.updated=Date.now();renderSide();renderBar();renderPane();renderTabs();renderLive();renderBoard();}

/* ---------- board modal ---------- */
function stickerHTML(s){
  const nofx=s.status==="ok"&&!s.effect?`<span class="nofx">This prototype can't build this yet, so it stays here for now</span>`:"";
  if(UI.editing===s.id)return `<div class="sticky editing" style="--rot:0deg"><textarea class="ed-text" data-edit-text="${s.id}" rows="2" aria-label="Rewrite this note">${esc(editableText(s))}</textarea><div class="ed-row"><button class="ed-save" data-edit-save="${s.id}">Done</button><button class="ed-cancel" data-edit-cancel>Cancel</button></div></div>`;
  if(s.status==="new")return `<div class="sticky new ${s.pop?"pop":""}" style="--rot:${s.rot}" role="button" tabindex="0" data-confirm="${s.id}" aria-label="Confirm note: ${esc(s.text)}"><button class="x" data-del="${s.id}" aria-label="Tear off this note">×</button>${esc(s.text)}${s.sub?`<span class="sub">${esc(s.sub)}</span>`:""}<span class="cta">Tap to confirm</span><button class="ed" data-edit="${s.id}" aria-label="Rewrite this note">✏️ Edit</button></div>`;
  return `<div class="sticky ok ${s.pop?"pop":""}" style="--rot:${s.rot}">${esc(s.text)}${s.sub?`<span class="sub">${esc(s.sub)}</span>`:""}${nofx}<button class="ed ok-ed" data-edit="${s.id}" aria-label="Changed your mind? Rewrite this note" title="Changed your mind? Edit it">✏️</button></div>`;
}
function boardHTML(){
  const cs=chars(),act=cs.find(c=>c.id===P.activeChar)||cs[0];
  const menu=UI.menuOpen?`<div class="menu" role="menu">${cs.map(c=>`<button role="menuitem" data-char="${c.id}"><span class="em">${c.effect.char.e}</span>${esc(c.effect.char.n)}<span class="st">${act&&c.id===act.id?"Main Character":c.status==="new"?"Not confirmed":"Side character"}</span></button>`).join("")}<button role="menuitem" class="add" data-act="addchar"><span class="em">+</span>Add a new character</button></div>`:"";

/* ---------- generation, with the gap-revealing prediction ---------- */
/* The prediction question always targets a GAP: something closely tied to what the kid just added,
   but deliberately NOT in the generated code because no sticker says it yet. Playing then reveals the gap. */
const RELATED={character:["rules"],objectives:["rules","outcome"],rules:["outcome","conflict","resources"],procedures:["boundaries","rules"],
  conflict:["resources","rules","outcome"],resources:["outcome","rules"],boundaries:["conflict","outcome"],outcome:["objectives","conflict"],
  players:["rules","outcome"],objectives2:["outcome"]};
function gapQuestion(col,c,t){
  const hero=c.hero.n,it=c.item.n,it1=sing(it);
  return ({
    rules:c.mode==="dodge"?`When a ${it1} hits the ${hero}, what will the game do?`:c.mode==="jump"?`When the ${hero} bumps into a ${it1}, what will the game do?`:c.mode==="shoot"?`When a bubble hits a ${it1}, what will the game do?`:`When the ${hero} catches a ${it1}, what will the game do?`,
    outcome:`With ${/^(this|the new)/.test(t)?t:"“"+t+"”"}, how will the game end?`,
    conflict:`With “${t}”, will anything show up to cause trouble?`,
    resources:`With “${t}”, can the ${hero} run out of lives or time?`,
    boundaries:`If the ${hero} keeps running right, what happens at the edge of the screen?`,
    procedures:`When you play “${t}”, how will you control the ${hero}?`,
    players:`Can you play “${t}” with a friend?`,
    objectives:`With “${t}”, what do you need to do to win?`

}
function submitGuess(){const g=UI.gen;if(!g||g.guess!==undefined||pumping)return;

  if(t){g.picked=null;g.guess=t;}else if(g.sel!=null){g.picked=g.sel;g.guess=g.P.a[g.sel].t;}else return;

/* a guess is phrased as what the kid expects to SEE; none of these are in the game yet */
function guessLabel(o,c){const e=o.e||{},h="the "+c.hero.n,it="the "+sing(c.item.n);
  if(e.onCatch==="score"||e.dodgeScore||e.jumpScore)return "you get 1 point";
  return ({grow:h+" grows and glows",bounce:it+" bounces away",split:it+" splits in two",stun:h+" gets dizzy",shrink:h+" shrinks",reset:"start over"})[e.onCatch||e.onHit]||o.t.replace(/^.*?: /,"");}
function predictionFor(news,c){
  const lit=new Set(P.stickers.filter(s=>s.status==="ok").map(s=>s.col));
  const last=news[news.length-1];
  const src=last.col==="objectives"&&last.effect&&!last.effect.mode?"objectives2":last.col;
  let col=(RELATED[src]||[]).find(k=>!lit.has(k));
  if(!col)col=["rules","outcome","conflict","resources","boundaries","procedures","objectives","players"].find(k=>!lit.has(k));
  if(!col)return {q:`After this change, the ${c.hero.n}'s game will feel…`,a:[{pic:"🔥",t:"more fun"},{pic:"🤔",t:"about the same"}]};
  const raw=last.text.replace(/[“”]/g,"");
  const t=raw.length>24?({rules:"this new rule",conflict:"the new challenge",resources:"the new resource",procedures:"the new controls",boundaries:"the new edges",outcome:"the new ending",players:"the new way to play",character:"the new character",objectives:"the new goal"})[last.col]||"this new idea":raw;
  return {gap:col,q:gapQuestion(col,c,t),a:optionsFor(col,c).map((o,i)=>({pic:o.pic,t:guessLabel(o,c),idx:i})).slice(0,3)};
}


function generate(){
  if(P.phase==="generating")return;
  const news=P.stickers.filter(s=>s.status==="ok"&&!built(s.id));
  if(!news.length||P.stickers.some(s=>s.status==="new"))return;
  const c=ctx(),Pq=predictionFor(news,c),round=P.versions.length+1;
  const lines=["Turning yellow notes into rules…",`Putting the ${c.hero.n} on the canvas…`,"Adding a breathing animation…","Hooking up the keyboard and mouse…","Checking edges and bumps…"];
  UI.gen={P:Pq,round,news,picked:null,done:false,status:lines[0],skipped:false};
  UI.boardOpen=false;P.phase="generating";UI.tab="create";
  say(P.versions.length?"Let's change your game! Quick quiz:":"Let's make your game! Quick quiz:");
  say(esc(Pq.q));
  render();
  let k=0;
  const tick=setInterval(()=>{k++;
    if(!UI.gen){clearInterval(tick);return;}
    if(k<lines.length)UI.gen.status=lines[k];
    else{clearInterval(tick);UI.gen.done=true;UI.gen.status="Your game is ready!";if(UI.gen.guess!==undefined){finishGen();return;}UI.gen.status="Your game is ready! Make your guess first, then go play.";}
    // update the status in place so a guess being typed isn't wiped
    const st=document.querySelector(".gen-status"),sh=document.querySelector(".shimmer");
    if(st){st.textContent=UI.gen.status;if(sh)sh.classList.toggle("done",UI.gen.done);}else renderLive();
  },900);
}
function finishGen(){
  const g=UI.gen;if(!g||!g.done)return;UI.gen=null;
  const first=g.round===1;
  g.news.forEach(s=>P.lastBuilt.push(s.id));
  const spec=buildSpec(false);
  const items=P.stickers.filter(s=>s.status==="ok"&&s.effect&&s.col!=="character").map(s=>s.text);
  P.versions.push({n:g.round,spec,items,summary:g.news.map(s=>s.text).join(" · "),snapshot:JSON.parse(JSON.stringify({stickers:P.stickers,activeChar:P.activeChar,lastBuilt:P.lastBuilt}))});
  const guess=g.guess!==undefined?g.guess:null;
  P.prediction=g.P.gap?{round:g.round,gap:g.P.gap,idx:g.picked!==null?g.P.a[g.picked].idx:null,guess}:null;
  P.phase="playtest";P.feel=null;P.found=null;UI.explained=null;UI.paneOpen=false;UI.tab="create";UI.firstOpen=first;UI.pendingSpec=spec;UI.asked=false;clearTimeout(UI.askTimer);
  say(guess?`Got it! ${first?"Your game is ready":"Your game is updated"}. Go play and see if you guessed right.`:(first?"Done 🎉 Tap the card below to play.":"Updated! Tap the card below to play the new version."));
  render();autosave();
}
/* picking an idea: a card only gets highlighted; "This one!" (or a typed idea) moves on */
const CONCEPT={
  rules:["The “if… then…” of your game: when something happens, what happens next.","Rules make the game react to everything you do."],
  outcome:["How the game ends: how you win, and how you lose.","It shows players what they're working toward."],
  conflict:["Things that get in your way, so the goal isn't too easy.","It makes the game more exciting."],
  resources:["Things that can run out, like lives, time or coins.","They make players careful, so every move matters."],
  procedures:["What players use to control the game, and how.","When the controls feel right, the game feels great to play."],
  boundaries:["Where the edges of the game world are, and what happens there.","They tell players where they can and can't go."],
  players:["Who plays: just you, or you and friends.","With two players, you can team up or compete."],
  objectives:["What players need to do.","A clear goal tells players what to do."]
};
function pickGo(){
  if(pumping)return;
  const typed=(UI.ownText||"").trim(),pr=P.prediction;let col,text=null;
  if(!typed&&UI.sel==="guess"&&pr&&pr.guess){
    UI.sel=null;say(`Put “${esc(pr.guess)}” into the game!`,"kid");
    pickDirection(pr.gap,true);
    if(pr.idx!==null){const o=UI.choice.options[pr.idx];addSticker(pr.gap,o.t,null,o.e);toConfirm("Done! Confirm it, and the next version will work like this.");}
    else matchFree(pr.guess,true);
    return;}
  if(typed){col=Object.keys(COL_WORDS).find(k=>COL_WORDS[k].some(w=>typed.toLowerCase().includes(w)));text=typed;say(esc(typed),"kid");
    if(!col){UI.ownText="";say("Interesting idea! Can you say a bit more? Like: when something touches something, what happens?");render();return;}}
  else if(UI.sel){col=UI.sel;const d=directions().find(x=>x.col===col&&!x.sel)||P.saved.find(x=>x.col===col);say(esc(d?d.q:questionFor(col,ctx())),"kid");}
  else return;
  UI.concept={col,text};UI.sel=null;UI.ownText="";
  if(UI.explained!==col)say(`This one is about <b>${COLMAP[col].zh}</b>. ${CONCEPT[col][0]}`);
  conceptDesign();
}
function conceptDesign(){
  const c=UI.concept;if(!c)return;UI.concept=null;
  P.saved=P.saved.filter(v=>v.col!==c.col);
  if(c.text){pickDirection(c.col,true);matchFree(c.text,true);return;}
  pickDirection(c.col,true);
  say(`OK! I started the sentence for you. Finish it, or tap an idea:<br>“${esc(UI.choice.stem)}…”`);render();
  setComposer(UI.choice.stem);const ta=$("#composer");ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);
}
function conceptOther(){if(pumping)return;UI.concept=null;P.phase="directions";say("OK, let's look at something else:");render();}
/* the play pane opens only when the kid taps the game card */
function openPane(){
  UI.paneOpen=true;UI.tab="preview";if(UI.firstOpen){UI.reveal=true;UI.firstOpen=false;}
  renderPane();renderTabs();renderLive();
  if(UI.pendingSpec){game.load(UI.pendingSpec);UI.pendingSpec=null;}
  setTimeout(()=>$("#cv").focus({preventScroll:true}),60);
  if(P.phase==="playtest"&&!UI.asked){clearTimeout(UI.askTimer);UI.askTimer=setTimeout(askFeel,ASK_AFTER);}
}
/* no "done" button: after a while, the game itself asks how it went and points to the chat box */
const ASK_AFTER=5000;
function askFeel(){
  if(P.phase!=="playtest"||UI.asked)return;UI.asked=true;
  const gs=P.prediction&&P.prediction.guess;
  say(gs?`You guessed “${esc(gs)}”. Did that really happen?`:"How was it? Was it different from what you imagined? What was different?");
  const pane=$("#pane .cab");if(pane&&!pane.querySelector(".ask")){const a=document.createElement("div");a.className="ask";a.setAttribute("role","status");
    a.innerHTML=`${ROBOT}<div><b>${gs?"You guessed “"+esc(gs)+"”. Did that happen?":"Was it different from what you imagined?"}</b><span>${innerWidth<=900?"Tap here and write what you saw":"Write to "+esc(botName())+" on the left"}</span></div><button class="x" data-act="dismissask" aria-label="Keep playing">×</button>`;
    pane.appendChild(a);}
  $(".composer").classList.add("nudge");
}
function clearAsk(){const a=document.querySelector("#pane .ask");if(a)a.remove();$(".composer").classList.remove("nudge");}
/* the kid's answer: respond to the feeling first, then reveal the gap, then the directions */
const FEELS=[
  {k:"hard",re:/hard|die|died|dead|lose|lost|too fast|can'?t|annoying|tired|difficult|难|死|输|太快/i,say:"A bit hard, right?"},
  {k:"easy",re:/easy|boring|bored|too slow|simple|no challenge|简单|无聊/i,say:"Too easy, huh?"},
  {k:"fun",re:/fun|cool|awesome|love|like|great|haha|lol|nice|好玩|喜欢/i,say:"Glad it's fun!"}
];
const NOTHING=/nothing|didn'?t|doesn'?t|\bno\b|\bnot\b|never|just|only|disappear|same|没有|没反应|只是|就消失/i;
const MISSING={rules:"what happens when things touch",outcome:"when the game ends",conflict:"what gets in the way",resources:"what can run out",boundaries:"what happens at the edge",procedures:"how to control it",players:"who plays",objectives:"how to win"};
function feelReply(t){
  if(UI.askTimer)clearTimeout(UI.askTimer);UI.asked=true;clearAsk();
  say(esc(t),"kid");
  const lit=new Set(P.stickers.filter(s=>s.status==="ok").map(s=>s.col)),pr=P.prediction;
  const f=FEELS.find(x=>x.re.test(t));P.feel=f?f.k:null;
  let col=null;
  if(pr&&pr.guess&&!lit.has(pr.gap)){
    // the guess didn't happen: say why, then name the concept
    col=pr.gap;
    const o=P.stickers.find(s=>s.col==="objectives"&&s.effect&&s.effect.mode),act=o?o.text.replace(/[“”]/g,""):"this game";
    say(NOTHING.test(t)?"Right!":"Look closer. It doesn't actually happen.");
    var why=`That's because you only said “${esc(act)}”. You didn't say ${MISSING[col]} yet. A computer only does what you tell it clearly.`;
  }else{
    col=Object.keys(COL_WORDS).find(k=>!lit.has(k)&&COL_WORDS[k].some(w=>t.toLowerCase().includes(w)))||(pr&&pr.gap&&!lit.has(pr.gap)&&NOTHING.test(t)?pr.gap:null);
    say(col?"You spotted it!":f?f.say:"Got it!");
  }
  P.found=col;
  const rest=()=>{
  if(why)say(why);
  if(col){const [what,impact]=CONCEPT[col];say(`In games, this is called <b>${COLMAP[col].zh}</b>. ${what} ${impact}`);UI.explained=col;}
  say(pr&&pr.guess&&col===pr.gap?`Want to really put your guess, “${esc(pr.guess)}”, into the game? Or check out other ideas:`:"I've got a few ideas. Want to try one?");
  UI.sel=null;UI.ownText="";P.phase="directions";render();autosave();};
  // first round only: right after the reaction, the "iterating is normal" callout; the robot carries on once it's closed
  if(!P.seen.includes("iterate")&&!UI.onboardQ.includes("iterate")){UI.afterIterate=rest;UI.onboardQ.push("iterate");P.phase="reacting";render();}
  else rest();
}
function directions(){
  const c=ctx(),lit=new Set(P.stickers.filter(s=>s.status==="ok").map(s=>s.col));
  const FEEL_ORDER={hard:["resources","boundaries","procedures"],easy:["conflict","resources","outcome"],fun:["outcome","players","conflict"]};
  const TAG={hard:"make it easier",easy:"add a challenge",fun:"more fun"};
  const base=["rules","outcome","conflict","resources","procedures","boundaries","objectives","players"];
  const card=(k,tag,kind)=>({col:k,ic:COLMAP[k].ic,en:COLMAP[k].en,zh:COLMAP[k].zh,q:questionFor(k,c),why:tag||"",isGap:kind==="gap"||kind==="found"});
  const out=[];const add=(k,tag,kind)=>{if(k&&!lit.has(k)&&!out.some(o=>o.col===k)&&out.length<3)out.push(card(k,tag,kind));};
  const pr=P.prediction;
  if(pr&&pr.guess&&pr.gap&&!lit.has(pr.gap))out.push({col:pr.gap,sel:"guess",q:`Put “${pr.guess}” into the game`,why:""});
  add(P.found,"you found it","found");
  add(pr&&pr.gap,"","gap");
  (FEEL_ORDER[P.feel]||[]).forEach(k=>add(k,TAG[P.feel]));
  base.forEach(k=>add(k));
  for(const k of ["procedures","conflict","rules"]){if(out.length>=3)break;if(out.some(o=>o.col===k))continue;
    out.push({col:k,ic:COLMAP[k].ic,en:COLMAP[k].en,zh:COLMAP[k].zh,q:k==="procedures"?"Do the controls feel good? How would you change them?":k==="conflict"?"What else could make it more challenging?":"What else do you want to happen?",why:""});}
  return out;
}
function rollback(){
  if(P.versions.length<2||pumping)return;
  const gone=P.versions.pop(),prev=P.versions[P.versions.length-1],snap=JSON.parse(JSON.stringify(prev.snapshot));
  clearTimeout(UI.askTimer);clearAsk();UI.pendingSpec=null;UI.paneOpen=true;
  P.stickers=snap.stickers;P.activeChar=snap.activeChar;P.lastBuilt=snap.lastBuilt;P.prediction=null;P.phase="directions";
  say(`Back to the last version. “${esc(gone.summary)}” is off the board now. Try bold ideas. You can always add it back.`);
  render();autosave();game.load(prev.spec);
}

/* ---------- projects + export ---------- */
function autosave(){
  if(!P.stickers.length)return false;
  const ok=saveProject(P);renderSide();return ok;
}
function toast(t){const el=document.createElement("div");el.className="toast";el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2200);}
function loadProject(p){
  Q.length=0;
  P=restoreProject(p,readBotName()||"");
  UI.boardOpen=false;UI.onboardQ=[];UI.gen=null;UI.paneOpen=!!P.versions.length;UI.tab=P.versions.length?"preview":"create";
  renderMsgs();render();
  const v=P.versions[P.versions.length-1];
  clearTimeout(UI.askTimer);UI.asked=false;UI.pendingSpec=null;
  if(v&&P.phase==="playtest"){UI.paneOpen=false;UI.tab="create";UI.pendingSpec=v.spec;game.clear();render();}
  else if(v)game.load(v.spec);else game.clear();
}
/* wipe everything (robot name, projects) and start like a first visit; asks for a second tap */
let restartArmed=0;
function restartAll(){
  const b=document.querySelector("[data-act=restart]");
  if(Date.now()-restartArmed>3000){restartArmed=Date.now();if(b){b.classList.add("arm");b.textContent="Tap again to delete all projects and start over";}
    setTimeout(()=>{const x=document.querySelector("[data-act=restart]");if(x&&Date.now()-restartArmed>=3000){x.classList.remove("arm");x.textContent="↺ Start over";}},3100);return;}
  restartArmed=0;clearTimeout(UI.askTimer);clearAsk();UI.pendingSpec=null;clearSavedData();
  Q.length=0;P=fresh();P.botName="";UI.expanded=new Set();UI.boardOpen=false;UI.onboardQ=[];UI.gen=null;UI.choice=null;UI.tab="create";UI.paneOpen=false;
  game.clear();renderMsgs();render();greet();
}
function newProject(){
  clearTimeout(UI.askTimer);clearAsk();UI.pendingSpec=null;
  if(autosave())toast("This project is already saved");
  Q.length=0;P=fresh();UI.boardOpen=false;UI.onboardQ=[];UI.gen=null;UI.choice=null;UI.tab="create";UI.paneOpen=false;
  game.clear();renderMsgs();render();greet();
}
function sheet(title,sub,body){
  const m=document.createElement("div");m.className="modal";
  m.innerHTML=`<div class="sheet narrow" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-h"><span class="t">${title}</span><span class="s">${sub}</span><button class="ibtn" data-close aria-label="Close">${X_ICON}</button></div><div class="sheet-b">${body}</div></div>`;
  m.addEventListener("click",e=>{if(e.target===m||e.target.closest("[data-close]"))m.remove();});
  $("#layer").appendChild(m);return m;
}
function exportHTML(){
  exportStandaloneGame(P.versions[P.versions.length-1],P.name,{sheet,toast,esc});
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target;
  const tab=t.closest("[data-tab]");if(tab&&tab.closest("#tabbar")){UI.tab=tab.dataset.tab;renderTabs();if(UI.tab==="preview")openPane();return;}
  const fill=t.closest("[data-fill]");if(fill){const i=$("#"+fill.dataset.fill);i.value=fill.dataset.val;if(i.id==="composer"){autosize();send();}else i.focus();return;}
  const ak=t.closest("#pane .ask");if(ak&&!t.closest("[data-act]")&&innerWidth<=900){UI.tab="create";renderTabs();setTimeout(()=>$("#composer").focus(),50);return;}
  const ed=t.closest("[data-edit]");if(ed){e.stopPropagation();if(onboardingOpen)return;UI.editing=ed.dataset.edit;renderBoard();const ta=boardEl.querySelector(".ed-text");if(ta){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);}return;}
  const es=t.closest("[data-edit-save]");if(es){saveEdit(es.dataset.editSave);return;}
  if(t.closest("[data-edit-cancel]")){UI.editing=null;renderBoard();return;}
  const del=t.closest("[data-del]");if(del){e.stopPropagation();delSticker(del.dataset.del);return;}
  const cf=t.closest("[data-confirm]");if(cf){if(!onboardingOpen)confirmSticker(cf.dataset.confirm);return;}
  const st=t.closest("[data-star]");if(st){const c=st.dataset.star,i=P.saved.findIndex(v=>v.col===c);
    if(i>=0)P.saved.splice(i,1);else{P.saved.push({col:c,q:st.dataset.q});UI.expanded.add(P.id);toast("Saved! Find it later in “My game ideas”");}renderSide();renderLive();autosave();return;}
  const ex=t.closest("[data-expand]");if(ex){const id=ex.dataset.expand;UI.expanded.has(id)?UI.expanded.delete(id):UI.expanded.add(id);renderSide();return;}
  const us=t.closest("[data-unstar]");if(us){P.saved=P.saved.filter(v=>v.col!==us.dataset.unstar);renderSide();renderLive();return;}
  const sl=t.closest("[data-sel]");if(sl){if(P.phase!=="directions")return;const c=sl.dataset.sel;UI.sel=UI.sel===c?null:c;const i=$("#ownIdea");if(i&&UI.sel){i.value="";UI.ownText="";}renderLive();return;}
  const dir=t.closest("[data-dir]");if(dir){if(pumping||!["directions","concept","choice"].includes(P.phase)){toast("Finish this round first, then pick from “My game ideas”");return;}
    if(innerWidth<=900)UI.sideOpen=false;UI.tab="create";UI.ownText="";UI.sel=dir.dataset.dir;P.phase="directions";pickGo();return;}
  const pk=t.closest("[data-pick]");if(pk){pickOption(+pk.dataset.pick);return;}
  const pp=t.closest("[data-p]");if(pp&&UI.gen&&UI.gen.guess===undefined){const i=+pp.dataset.p;UI.gen.sel=UI.gen.sel===i?null:i;if(UI.gen.sel!=null)UI.gen.typed="";renderLive();return;}
  const op=t.closest("[data-open]");if(op){const p=allProjects().find(x=>x.id===op.dataset.open);if(p&&p.id!==P.id){autosave();loadProject(p);}if(innerWidth<=900){UI.sideOpen=false;renderSide();}return;}
  const ch=t.closest("[data-char]");if(ch){
    const s=P.stickers.find(x=>x.id===ch.dataset.char);UI.menuOpen=false;
    if(s&&P.activeChar!==s.id){P.activeChar=s.id;
      if(s.status==="ok"&&P.versions.length){say(`Your hero is now ${s.effect.char.e} <b>${esc(s.effect.char.n)}</b>. In the next version, Player 1 controls it.`);P.lastBuilt=P.lastBuilt.filter(x=>x!==s.id);if(P.phase==="directions")P.phase="confirm";}}
    render();return;}
  const a=t.closest("[data-act]");
  if(a){const act=a.dataset.act;
    ({opening:doOpening,send,generate,rollback,export:exportHTML,
      board:()=>{UI.boardOpen=true;renderBoard();},closeboard:()=>{UI.boardOpen=false;UI.menuOpen=false;renderBoard();},
      menu:()=>{UI.menuOpen=!UI.menuOpen;renderBoard();},
      addchar:()=>{UI.menuOpen=false;if(P.phase==="generating")return;UI.boardOpen=false;renderBoard();say("I want to add another character","kid");say("OK! Who is the new character?");P.phase="newchar";UI.tab="create";render();$("#composer").focus();},
      cancel:()=>{setComposer("");P.phase=P.versions.length?(P.stickers.some(s=>s.status==="new"||(s.status==="ok"&&!built(s.id)))?"confirm":"directions"):(chars().length?"confirm":"opening");render();},
      guess:submitGuess,
      skip:()=>{if(!UI.gen)return;UI.gen.skipped=true;if(UI.gen.done)finishGen();else{UI.gen.status="OK, skipping. Almost done…";renderLive();}},
      go:finishGen,openpane:openPane,pickgo:pickGo,cdesign:conceptDesign,cother:conceptOther,dismissask:()=>{const a=document.querySelector("#pane .ask");if(a)a.remove();},closepane:()=>{UI.paneOpen=false;UI.tab="create";renderPane();renderTabs();renderLive();},
      side:()=>{UI.sideOpen=!UI.sideOpen;renderSide();},
      save:()=>{if(!P.stickers.length){toast("Share your first idea, then save");return;}toast(autosave()?"Saved on this device":"This browser won't let me save. Try another window.");},
      new:newProject,rename:renameBot,tour:startTour,restart:restartAll
    })[act]?.();
    return;}
  if(UI.menuOpen&&!t.closest(".picker")){UI.menuOpen=false;renderBoard();}
  if(boardEl&&t===boardEl&&!onboardingOpen){UI.boardOpen=false;renderBoard();}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey&&e.target.id==="composer"){e.preventDefault();send();return;}
  if(e.key==="Enter"&&(e.target.id==="inWho"||e.target.id==="inDo"))doOpening();
  if(e.key==="Enter"&&e.target.id==="guessIn"&&!e.isComposing){e.preventDefault();if(UI.gen)UI.gen.typed=e.target.value;submitGuess();return;}
  if(e.key==="Enter"&&e.target.id==="ownIdea"&&!e.isComposing){e.preventDefault();UI.ownText=e.target.value;pickGo();return;}
  if(e.target.matches("[data-edit-text]")){if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();saveEdit(e.target.dataset.editText);}else if(e.key==="Escape"){UI.editing=null;renderBoard();}return;}
  if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-confirm]")){e.preventDefault();confirmSticker(e.target.dataset.confirm);}
  if(e.key==="Escape"){if(UI.menuOpen){UI.menuOpen=false;renderBoard();}else if(UI.boardOpen&&!onboardingOpen){UI.boardOpen=false;renderBoard();}}
});
$("#composer").addEventListener("input",autosize);
document.addEventListener("input",e=>{if(e.target.id==="guessIn"&&UI.gen){UI.gen.typed=e.target.value;if(e.target.value.trim()&&UI.gen.sel!=null){UI.gen.sel=null;document.querySelectorAll(".pchoice.picked").forEach(x=>x.classList.remove("picked"));}
    const b=document.querySelector("[data-act=guess]");if(b)b.disabled=!(UI.gen.sel!=null||e.target.value.trim());return;}
  if(e.target.id!=="ownIdea")return;UI.ownText=e.target.value;if(e.target.value.trim()&&UI.sel){UI.sel=null;document.querySelectorAll(".dir.sel,.chip.on").forEach(x=>x.classList.remove("sel","on"));}
  const b=document.querySelector("[data-act=pickgo]");if(b)b.disabled=!(UI.sel||e.target.value.trim());});
$("#gameName").addEventListener("input",e=>{P.name=e.target.value;P.nameEdited=true;renderSide();$("#paneTitle").textContent=P.name||"My game";});

/* ---------- brand logo: token hops at uneven moments at uneven moments ---------- */
document.querySelectorAll("[data-bricks]").forEach(box=>{box.innerHTML=LOGO;});
if(!reduced){const all=[...document.querySelectorAll(".pz")];
  (function go(){const n=Math.random()<.28?2:1;for(let k=0;k<n;k++){const b=all[Math.floor(Math.random()*all.length)];
    b.style.setProperty("--h",(-5-Math.random()*9).toFixed(1)+"px");b.style.setProperty("--r",(Math.random()*30-15).toFixed(0)+"deg");b.style.setProperty("--d",(.32+Math.random()*.4).toFixed(2)+"s");
    b.classList.remove("hop","wig");void b.getBoundingClientRect();b.classList.add(Math.random()<.2?"wig":"hop");}
    setTimeout(go,Math.random()<.3?120+Math.random()*220:450+Math.random()*1500);})();}
/* robot blinks at uneven intervals */
if(!reduced)(function blink(){document.querySelectorAll(".eye").forEach(e=>{e.style.transform="scaleY(.2)";});
  setTimeout(()=>document.querySelectorAll(".eye").forEach(e=>e.style.transform=""),120);setTimeout(blink,1800+Math.random()*3500);})();

/* ---------- boot ---------- */
const game=window.TinkerEngine($("#cv"));
function greet(){
  if(!P.botName){P.phase="naming";say("Hi! I'm your game design robot buddy.");say("But I don't have a name yet. What do you want to call me? Type a name below!");return;}
  say(`Hi! I'm <b>${esc(P.botName)}</b>, your game design buddy.`);
  say("Today we'll make a game you can really play. First, tell me: <b>who</b> is the hero, and what is it <b>doing</b>?");
}
function renameBot(){
  const m=sheet("Rename your buddy","The new name works right away",`<input class="name-in" id="botIn" maxlength="14" value="${esc(botName())}" aria-label="Robot's name"><div class="row"><button class="btn" id="botOk">That's it!</button></div>`);
  const i=m.querySelector("#botIn");i.focus();i.select();
  const ok=()=>{const n=i.value.trim().slice(0,14);if(!n)return;P.botName=n;saveBotName(n);m.remove();say(`Sure! From now on, I'm <b>${esc(n)}</b>!`);render();};
  m.querySelector("#botOk").onclick=ok;i.addEventListener("keydown",e=>{if(e.key==="Enter")ok();});
}
render();greet();
})();

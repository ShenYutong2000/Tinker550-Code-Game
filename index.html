<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tinkercade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Press+Start+2P&family=Patrick+Hand&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Layout: Claude-style three panes. Flush sidebar (projects + nav), chat as the main column with the composer at the bottom, game in a side pane like an artifact panel. Calm dark surfaces, brand orange/yellow as accents only. */
:root{
  --bg:#18141F;
  --side:#110E17;
  --pane:#1D1926;
  --raise:#272233;
  --line:#2F2940;
  --text:#EEEAF6;
  --muted:#9D96B0;
  --orange:#FF6B35;
  --orange-deep:#D9481A;
  --yellow:#FFD166;
  --red:#FF7B7B;
  --red-ink:#4E0F12;
  --yel-ink:#3D2A00;
  --mint:#5EE6B8;
  --shade:rgba(6,4,12,.66);
  --f-pixel:"Press Start 2P", ui-monospace, "Courier New", monospace;
  --f-hand:"Patrick Hand", "Comic Sans MS", system-ui, sans-serif;
  --f-body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.65;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,canvas:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
svg{flex:none}

.app{height:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto}

/* ---- brand ---- */
.brand{display:flex;align-items:center;gap:6px;min-width:0}
.bricks{display:block;width:36px;height:36px;flex:none}
.bricks svg{display:block;overflow:visible}
.pz{transform-box:fill-box;transform-origin:50% 100%}
.pz.hop{animation:hop var(--d,.5s) cubic-bezier(.3,.7,.4,1)}
.pz.wig{animation:flip .7s ease-in-out;transform-origin:50% 50%}
@keyframes flip{0%{transform:none}50%{transform:scaleX(.06) translateY(-6px)}100%{transform:none}}
@keyframes hop{0%{transform:none}15%{transform:scale(1.12,.82)}45%{transform:translateY(var(--h,-3px)) rotate(var(--r,8deg)) scale(.94,1.08)}75%{transform:scale(1.08,.9)}100%{transform:none}}
@keyframes wig{0%,100%{transform:none}25%{transform:rotate(var(--r,10deg))}60%{transform:rotate(calc(var(--r,10deg) * -0.6))}}
.wm{font-family:'Fredoka',var(--f-body);font-weight:700;font-size:21px;letter-spacing:.2px;color:var(--yellow);line-height:1}
.wm b{color:var(--orange);font-weight:700}

/* ---- sidebar ---- */
.side{width:268px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding:14px 12px 12px 16px;gap:4px}
.app.side-closed .side{display:none}
.side-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 2px 12px}
.ibtn{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;border:none;background:transparent;color:var(--muted)}
.ibtn:hover{background:var(--raise);color:var(--text)}
.sbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:none;border-radius:8px;padding:7px 10px;font-size:14px;color:var(--text)}
.sbtn:hover{background:var(--raise)}
.sbtn.restart{font-size:12.5px;color:var(--muted);padding:6px 10px;margin-top:4px}
.sbtn.restart.arm{color:var(--red,#FF8A80);font-weight:700}
.sbtn.new .plus{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--orange);color:#fff;font-weight:700;font-size:15px;line-height:1}
.sbtn .ct{margin-left:auto;font-size:12px;color:var(--muted)}
.sbtn .badge{margin-left:auto;min-width:22px;text-align:center;font-size:12px;font-weight:700;background:var(--yellow);color:var(--yel-ink);border-radius:999px;padding:0 7px}
.sec{margin-top:14px;padding:0 10px 4px;font-size:12px;color:var(--muted)}
.scroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:1px;margin-right:-4px;padding-right:4px}
.proj{display:flex;align-items:center;gap:2px;width:100%;border-radius:8px;padding:2px 8px 2px 2px;font-size:14px;color:var(--text)}
.proj .tw{width:22px;height:28px;flex:none;background:none;border:none;color:var(--muted);font-size:11px;border-radius:6px;padding:0}
.proj .tw:hover{color:var(--text)}
.proj .pn{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:none;border:none;text-align:left;padding:4px 4px;font-size:14px;color:var(--text)}
.proj .fav-ct{font-size:11.5px;color:var(--yellow);flex:none}
.favs{margin:2px 0 6px 24px;padding-left:8px;border-left:1px solid var(--line)}
.favs-h{font-size:11.5px;color:var(--muted);padding:4px 10px 2px}
.proj:hover{background:var(--raise)}
.proj.on{background:var(--raise)}
.proj .em{font-size:15px}
.proj .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saved-item{display:flex;align-items:flex-start;gap:6px;border-radius:8px;padding:5px 6px 5px 10px}
.saved-item:hover{background:var(--raise)}
.saved-item button.go{flex:1;min-width:0;background:none;border:none;text-align:left;padding:0;font-size:13px;line-height:1.45;color:var(--text)}
.saved-item button.go .s{color:var(--yellow);margin-right:4px}
.saved-item .x{background:none;border:none;color:var(--muted);padding:0 4px;font-size:15px;line-height:1.3}
.empty-note{padding:2px 10px;font-size:12.5px;color:#766f8c;line-height:1.5}
.grow{margin-top:8px;background:var(--pane);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.grow p{margin:0;font-size:13px;line-height:1.45}
.grow b{color:var(--yellow)}
.studs{display:grid;grid-template-columns:repeat(9,1fr);gap:3px}
.studs i{height:8px;border-radius:2px;background:var(--raise)}
.studs i.on{background:var(--orange)}
.studs i.on:nth-child(2n){background:var(--yellow)}
.grow .cap{font-size:11.5px;color:var(--muted)}

/* ---- main chat column ---- */
.main{min-width:0;min-height:0;display:flex;flex-direction:column;position:relative}
.bar{height:52px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px}
.bar .open-side{display:none}
.app.side-closed .bar .open-side{display:grid}
.app.side-closed .bar .brand-mini{display:flex}
.brand-mini{display:none;align-items:center;gap:8px;margin-right:4px}
.title-in{min-width:0;flex:0 1 auto;width:auto;max-width:360px;font:500 15px var(--f-body);color:var(--text);background:transparent;border:1px solid transparent;border-radius:8px;padding:5px 8px}
.title-in:hover{border-color:var(--line)}
.title-in:focus{border-color:var(--orange);outline:none}
.bar .sp{flex:1}
.tbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;border-radius:8px;padding:5px 11px;font-size:13px;color:var(--text)}
.tbtn:hover{background:var(--raise)}
.tbtn:disabled{opacity:.4;cursor:not-allowed}
.tbtn.accent{background:var(--orange);border-color:var(--orange);color:#fff}
.tbtn.accent:hover{background:var(--orange-deep)}
.feed{flex:1;min-height:0;overflow-y:auto;padding:8px 16px 24px}
.thread{width:min(720px,100%);margin:0 auto;display:flex;flex-direction:column;gap:22px}
.msg{display:flex;gap:12px;align-items:flex-start}
.msg.enter{animation:rise .32s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg .body{min-width:0;flex:1;font-family:var(--f-hand);font-size:17px;line-height:1.6}
.msg .body b{color:var(--yellow);font-weight:700}
.msg.kid{justify-content:flex-end}
.msg.kid .body{flex:0 1 auto;max-width:80%;background:var(--raise);border-radius:18px;padding:9px 15px;font-family:var(--f-hand);font-size:17px;line-height:1.5}
.msg.kid .body b{color:var(--text);font-weight:400}
.avatar{width:32px;height:32px;flex:none;margin-top:0}
.eye{transform-box:fill-box;transform-origin:center;transition:transform .08s}
.typing{display:flex;gap:5px;align-items:center;height:32px}
.typing .who{font-size:12.5px;color:var(--muted);margin-left:6px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:dot 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes dot{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.live{padding-left:42px;display:flex;flex-direction:column;gap:12px}
.live.enter{animation:rise .32s ease-out}
.live:empty{display:none}

/* widgets inside the conversation */
.card{background:var(--pane);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.blank{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:var(--f-hand);font-size:19px}
.blank input{font-family:var(--f-hand);font-size:19px;background:transparent;border:none;border-bottom:2px dashed var(--yellow);color:var(--yellow);padding:0 4px;width:6.5em;min-width:0}
.blank input::placeholder{color:#6f6886}
.blank input:focus{outline:none;border-bottom-style:solid}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips .lab{font-size:12.5px;color:var(--muted);margin-right:2px}
.chip{border:1px solid var(--line);background:var(--raise);border-radius:999px;padding:3px 12px;font-size:13.5px}
.chip:hover{border-color:var(--yellow)}
.chip.opt{font-family:var(--f-hand);font-size:15.5px;border-radius:10px;padding:5px 12px;text-align:left}
.chip.opt .tag{font-family:var(--f-body);font-size:10.5px;background:var(--yellow);color:var(--yel-ink);border-radius:999px;padding:0 6px;margin-left:6px}
.btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:10px;padding:8px 16px;font-weight:700;font-size:14px;background:var(--orange);color:#fff}
.btn:hover{background:var(--orange-deep)}
.btn:disabled{background:var(--raise);color:#6f6886;cursor:not-allowed}
.btn.soft{background:var(--raise);color:var(--text);font-weight:500}
.btn.soft:hover{background:#322b42}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hint{font-size:13px;color:var(--muted);margin:0}
.dirs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.dir{position:relative;background:var(--pane);border:1px solid var(--line);border-radius:14px;transition:border-color .15s,transform .15s}
.dir:hover{border-color:var(--yellow);transform:translateY(-2px)}
.dir.gap{border-color:rgba(94,230,184,.55)}
.dir-go{width:100%;text-align:left;display:flex;flex-direction:column;gap:5px;background:none;border:none;padding:12px 36px 12px 14px}
.dir .lab{font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--orange)}
.dir.gap .lab{color:var(--mint)}
.dir .q{font-size:14.5px;font-weight:500;line-height:1.45}
.own{display:flex;gap:8px;margin-top:10px;width:min(560px,100%)}
.own input{flex:1;min-width:0;background:var(--pane);border:1px solid var(--line);border-radius:12px;padding:9px 12px;color:var(--text);font:16px/1.4 var(--f-hand)}
.own input:focus{outline:none;border-color:var(--orange)}
.own input::placeholder{color:#6f6886;font-family:var(--f-body);font-size:14px}
.dir.sel{border-color:var(--orange);box-shadow:0 0 0 2px rgba(255,107,53,.35);background:#2a1f22}
.dir .tag{align-self:flex-start;font-size:11px;font-weight:700;color:var(--yel-ink);background:var(--yellow);border-radius:999px;padding:1px 7px}
.chip.on{border-color:var(--orange);color:var(--text)}
.own .btn:disabled{opacity:.45;cursor:not-allowed}
.dir .lab .tag{margin-left:8px;font-size:11px;font-weight:700;letter-spacing:0;color:var(--yel-ink);background:var(--yellow);border-radius:999px;padding:1px 7px}
.star{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:8px;border:none;background:transparent;font-size:17px;line-height:1;color:var(--muted)}
.star:hover{background:var(--raise)}
.star.on{color:var(--yellow)}
.shimmer{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--raise) 0%,var(--raise) 35%,var(--orange) 50%,var(--yellow) 55%,var(--raise) 70%) 0 0/250% 100%;animation:shim 1.3s linear infinite}
.shimmer.done{animation:none;background:var(--mint)}
@keyframes shim{from{background-position:120% 0}to{background-position:-130% 0}}
.gen-status{font-size:13px;color:var(--muted)}
.pq{font-family:var(--f-hand);font-size:19px;line-height:1.4}
.pchoices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.gen-pick{display:flex;flex-direction:column;gap:2px}
.pchoice{background:var(--raise);border:2px solid transparent;border-radius:12px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--f-hand);font-size:16px}
.pchoice .pic{font-size:30px;line-height:1.15}
.pchoice:hover{border-color:var(--yellow)}
.pchoice.picked{border-color:var(--orange)}
.link{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:13px;padding:0}
.art{display:flex;align-items:center;gap:12px;background:var(--pane);border:1px solid var(--line);border-radius:14px;padding:10px 14px;text-align:left;width:min(360px,100%)}
.art:hover{border-color:var(--orange)}
.art .ic{width:40px;height:40px;border-radius:10px;background:var(--raise);display:grid;place-items:center;font-size:20px}
.art .t{font-weight:500;font-size:14px}
.art .s{font-size:12px;color:var(--muted)}

/* composer */
.composer-wrap{flex:none;padding:0 16px 14px}
.composer{width:min(720px,100%);margin:0 auto;background:var(--pane);border:1px solid var(--line);border-radius:18px;padding:10px 10px 10px 16px;display:flex;align-items:flex-end;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.composer:focus-within{border-color:#4a4160}
.composer textarea{flex:1;min-width:0;resize:none;border:none;background:transparent;color:var(--text);font:16px/1.5 var(--f-hand);padding:6px 0;max-height:140px}
.composer textarea:focus{outline:none}
.composer textarea::placeholder{color:#6f6886;font-family:var(--f-body);font-size:14.5px}
.send{width:36px;height:36px;border-radius:10px;border:none;background:var(--orange);color:#fff;display:grid;place-items:center}
.send:disabled{background:var(--raise);color:#6f6886;cursor:not-allowed}
.foot-note{width:min(720px,100%);margin:6px auto 0;text-align:center;font-size:11.5px;color:#6f6886}

/* ---- game pane (artifact-style) ---- */
.pane{width:min(46vw,620px);min-width:400px;background:var(--pane);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.app:not(.has-pane) .pane{display:none}
.pane.reveal{animation:slide .5s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.pane-h{height:52px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px 0 16px;border-bottom:1px solid var(--line)}
.pane-h .t{font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pane-h .v{font-size:12px;color:var(--mint);border:1px solid rgba(94,230,184,.4);border-radius:999px;padding:0 8px}
.pane-h .sp{flex:1}
.pane-b{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.cab{background:#0B0818;border:2px solid var(--orange);border-radius:12px;padding:6px;position:relative}
.cab .ask{position:absolute;left:14px;right:14px;top:14px;display:flex;align-items:center;gap:10px;background:var(--yellow);color:var(--yel-ink);border-radius:14px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.45);animation:askin .45s cubic-bezier(.3,1.4,.5,1);cursor:default}
.cab .ask .avatar{width:36px;height:36px}
.cab .ask b{display:block;font-family:var(--f-hand);font-size:18px;font-weight:400;line-height:1.3}
.cab .ask span{font-size:12.5px;opacity:.8}
.cab .ask .x{margin-left:auto;align-self:flex-start;background:none;border:none;color:var(--yel-ink);font-size:18px;line-height:1;padding:0 2px;opacity:.6}
@keyframes askin{from{transform:translateY(-12px) scale(.96);opacity:0}}
.composer.nudge{border-color:var(--yellow);animation:nudge 1.6s ease-in-out 3}
@keyframes nudge{50%{box-shadow:0 0 0 4px rgba(255,209,102,.35)}}
.art.play{width:min(420px,100%);padding:14px 16px;border-color:#6b4a2c;cursor:pointer;transition:transform .15s,border-color .15s}
.art.play:hover{transform:translateY(-2px);border-color:var(--orange)}
.art.play .ic{width:48px;height:48px;font-size:24px;background:linear-gradient(160deg,#3a2a1f,#2a1f2e)}
.art.play .t{font-size:15px}
.art .go{margin-left:auto;width:34px;height:34px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-size:13px}
canvas{display:block;width:100%;aspect-ratio:3/2;max-width:100%;border-radius:7px;background:#0E0A22;touch-action:none}
.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px;color:var(--muted);align-items:center}
.key{font-family:var(--f-pixel);font-size:8px;border:1px solid var(--line);border-bottom-width:3px;border-radius:4px;padding:3px 5px;color:var(--text);background:var(--raise)}
.impl{font-size:13px}
.impl h5{margin:0 0 6px;font-size:12px;font-weight:700;color:var(--muted)}
.impl ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:2px}
.impl li.off{color:#766f8c}

/* ---- modals ---- */
.modal{position:fixed;inset:0;z-index:60;background:var(--shade);display:grid;place-items:center;padding:16px}
.sheet{width:min(1080px,100%);max-height:calc(100% - 8px);overflow-y:auto;background:var(--pane);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.5);display:flex;flex-direction:column}
.sheet.narrow{width:min(560px,100%)}
.sheet-h{position:sticky;top:0;z-index:5;background:var(--pane);display:flex;align-items:center;gap:10px;padding:14px 16px 12px 20px;border-bottom:1px solid var(--line)}
.sheet-h .t{font-weight:700;font-size:15px}
.sheet-h .s{font-size:12.5px;color:var(--muted)}
.sheet-h .ibtn{margin-left:auto}
.sheet-b{padding:18px 20px;display:flex;flex-direction:column;gap:16px}
textarea.code{width:100%;height:220px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;font:12px/1.4 ui-monospace,monospace;padding:10px;resize:vertical}

/* board */
.entity{display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;transition:filter .3s,opacity .3s,transform .3s}
.entity .title{font-size:11px;font-weight:700;letter-spacing:.8px;color:var(--yellow);display:flex;flex-direction:column;gap:8px}
.picker{position:relative}
.pick-btn{display:flex;align-items:center;gap:8px;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-family:var(--f-hand);font-size:16px;color:var(--text)}
.pick-btn:hover{border-color:var(--yellow)}
.pick-btn .em{font-size:20px;line-height:1}
.pick-btn .role{font-family:var(--f-body);font-size:11px;color:var(--muted)}
.menu{position:absolute;top:calc(100% + 6px);left:0;z-index:30;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:6px;min-width:240px;display:flex;flex-direction:column;gap:2px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.menu button{display:flex;gap:8px;align-items:center;text-align:left;background:transparent;border:none;border-radius:8px;padding:7px 8px;font-family:var(--f-hand);font-size:16px}
.menu button:hover{background:#332c45}
.menu .em{font-size:19px}
.menu .st{margin-left:auto;font-family:var(--f-body);font-size:11px;color:var(--muted)}
.menu .add{color:var(--muted);border-top:1px solid var(--line);border-radius:0 0 8px 8px}
.ent-stickers{display:flex;gap:14px;flex-wrap:wrap;flex:1;min-width:0;padding-top:6px}

.sticky{position:relative;font-family:var(--f-hand);font-size:15px;line-height:1.3;padding:12px 10px 10px;border-radius:2px;transform:rotate(var(--rot,0deg));box-shadow:2px 4px 0 rgba(0,0,0,.35);text-align:left;width:100%;border:none}
.sticky::before{content:"";position:absolute;top:-7px;left:50%;width:42px;height:14px;transform:translateX(-50%) rotate(-3deg);background:rgba(255,255,255,.35)}
.sticky .sub{display:block;font-family:var(--f-body);font-size:11px;opacity:.75;margin-top:3px}
.sticky.new{background:var(--red);color:var(--red-ink);animation:wiggle 1.4s ease-in-out infinite;cursor:pointer}
.sticky.new .cta{display:inline-block;margin-top:6px;font-family:var(--f-body);font-size:11px;font-weight:700;background:var(--red-ink);color:var(--red);border-radius:999px;padding:1px 8px}
.sticky.ok{background:var(--yellow);color:var(--yel-ink);padding-bottom:20px}
.sticky.ok::after{content:"";position:absolute;top:6px;right:8px;width:10px;height:10px;border-radius:50%;background:var(--orange);box-shadow:inset -2px -2px 0 rgba(0,0,0,.25)}
.sticky.pop{animation:stamp .45s ease-out}
.sticky .x{position:absolute;top:2px;right:4px;background:none;border:none;font-size:14px;color:var(--red-ink);padding:2px 4px;opacity:.7}
.sticky .ed{margin:6px 0 0 6px;font-family:var(--f-body);font-size:11px;font-weight:700;background:rgba(255,255,255,.55);color:var(--red-ink);border:none;border-radius:999px;padding:1px 8px;cursor:pointer}
.sticky .ed.ok-ed{position:absolute;right:4px;bottom:4px;margin:0;padding:1px 5px;background:transparent;color:var(--yel-ink);opacity:.45;font-size:12px}
.sticky.ok:hover .ed.ok-ed,.sticky .ed.ok-ed:focus-visible{opacity:1}
.sticky.editing{background:#fff6d8;color:var(--yel-ink);outline:2px dashed var(--orange);outline-offset:2px}
.sticky .ed-text{width:100%;resize:none;border:none;background:transparent;font:inherit;color:inherit;outline:none;padding:0}
.sticky .ed-row{display:flex;gap:6px;margin-top:6px}
.sticky .ed-row button{font-family:var(--f-body);font-size:12px;font-weight:700;border:none;border-radius:999px;padding:3px 10px;cursor:pointer}
.ed-save{background:var(--orange);color:#fff}.ed-cancel{background:rgba(0,0,0,.08);color:var(--yel-ink)}
.sticky .nofx{display:block;font-family:var(--f-body);font-size:11px;margin-top:3px;opacity:.8}
.ent-stickers .sticky{width:auto;min-width:130px;max-width:220px}
@keyframes wiggle{0%,100%{transform:rotate(var(--rot,0deg))}50%{transform:rotate(calc(var(--rot,0deg) + 2deg)) translateY(-1px)}}
@keyframes stamp{0%{transform:scale(1.25) rotate(var(--rot,0deg))}60%{transform:scale(.95) rotate(var(--rot,0deg))}100%{transform:scale(1) rotate(var(--rot,0deg))}}
.board-foot{position:sticky;bottom:0;background:var(--pane);display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 20px;border-top:1px solid var(--line);transition:filter .3s,opacity .3s}

.callout .demo span{padding:4px 8px;border-radius:2px;box-shadow:1px 2px 0 rgba(0,0,0,.25)}
.spot-block{position:fixed;inset:0;z-index:70}

.bot-row{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;font-size:13.5px}

.bot-row button{margin-left:auto;background:none;border:none;color:var(--muted);font-size:12px;text-decoration:underline;padding:0}
.name-in{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text);font:18px var(--f-hand)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;z-index:90;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--raise);border:1px solid var(--line);color:var(--text);font-size:13.5px;border-radius:999px;padding:8px 16px;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:pop .25s ease-out}

}

<script id="engineSrc">
(function(){
const rand=(a,b)=>a+Math.random()*(b-a);
const W=480,H=320,GROUND=H-30;
const EMOJI='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
function Game(canvas){
  const g=canvas.getContext("2d");
  let sp=null,st=null,lastInput="keys",best=[];
  const keys=new Set(),pressed=new Set();
  const mouse={x:W/2,y:H/2,active:false,clicked:false};
  let focused=false;
  const bgStars=Array.from({length:46},()=>({x:Math.random()*W,y:Math.random()*H*.85,s:Math.random()<.2?2:1,p:Math.random()*6}));
  function fit(){const d=Math.min(2,devicePixelRatio||1);canvas.width=W*d;canvas.height=H*d;g.setTransform(d,0,0,d,0,0);}
  fit();
  const norm=k=>k.length===1?k.toLowerCase():k;
  canvas.addEventListener("keydown",e=>{const k=norm(e.key);if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," ","w","a","s","d","f"].includes(k))e.preventDefault();if(!keys.has(k))pressed.add(k);keys.add(k);lastInput="keys";});
  canvas.addEventListener("keyup",e=>keys.delete(norm(e.key)));
  canvas.addEventListener("focus",()=>focused=true);
  canvas.addEventListener("blur",()=>{focused=false;keys.clear();});
  const pos=e=>{const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};};
  canvas.addEventListener("pointermove",e=>{const p=pos(e);mouse.x=p.x;mouse.y=p.y;mouse.active=true;lastInput="mouse";});
  canvas.addEventListener("pointerdown",e=>{const p=pos(e);mouse.x=p.x;mouse.y=p.y;mouse.active=true;if(focused)mouse.clicked=true;canvas.focus();if(e.pointerType!=="mouse")lastInput="mouse";});

  function hero(i){
    const e=i===0?sp.hero:(sp.others[0]||sp.hero);
    const m=sp.mode;
    return {i,e:e?e.e:"👾",n:e?e.n:"",x:m==="jump"?90+i*46:W/2+(sp.players===2?(i?60:-60):0),y:m==="roam"?H/2:GROUND-18,vy:0,kx:0,r:18,scale:1,ts:1,glow:0,stun:0,inv:0,dir:1,moving:0,cd:0,onGround:true};
  }
  function load(spec){sp=spec;reset();}
  function clear(){sp=null;st=null;}
  function reset(){
    st={t:0,heroes:[hero(0)],goods:[],hz:[],bul:[],parts:[],pops:[],npcs:[],score:[0,0],lives:sp.lives||0,timer:sp.timer||0,coins:0,sg:.4,sh:1.2,sb:2,over:null,ot:0,enemy:null,alive:0};
    if(sp.players===2) st.heroes.push(hero(1));
    const npcSrc=sp.players===2?sp.others.slice(1):sp.others;
    npcSrc.forEach((o,k)=>st.npcs.push({e:o.e,x:60+k*90,y:sp.mode==="roam"?80+k*40:GROUND-16,vx:(k%2?-1:1)*40,t:Math.random()*5}));
    if(sp.enemy) st.enemy={x:W-30,y:40,e:sp.enemy};
  }
  const hasScore=()=>sp.onCatch==="score"||sp.dodgeScore||sp.jumpScore;
  function addScore(i,n,x,y){const k=sp.pmode==="versus"?i:0;st.score[k]+=n;st.pops.push({x,y,t:0,s:"+"+n,c:"#FFD166"});}
  function poof(x,y,c){for(let k=0;k<10;k++){const a=Math.random()*6.28,v=rand(40,140);st.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,life:rand(.3,.6),c});}}
  function confetti(){for(let k=0;k<90;k++)st.parts.push({x:rand(0,W),y:rand(-60,0),vx:rand(-30,30),vy:rand(60,160),t:0,life:2.6,c:["#FF6B35","#FFD166","#5EE6B8","#FF7B7B"][k%4],sq:1});}
  function end(kind){
    if(st.over)return;st.over=kind;st.ot=0;
    const tot=st.score[0]+st.score[1];
    if(sp.outcome==="leaderboard"){best.push(tot);best.sort((a,b)=>b-a);best=best.slice(0,5);}
    if(sp.outcome==="celebrate"&&kind==="win")confetti();
  }
  function ctrl(i){
    const c=sp.control,two=sp.players===2,k=keys;let dx=0,dy=0,jump=false,fire=false;
    if(i===0&&c!=="mouse"){
      if(k.has("ArrowLeft")||(!two&&k.has("a")))dx--;if(k.has("ArrowRight")||(!two&&k.has("d")))dx++;
      if(k.has("ArrowUp")||(!two&&k.has("w")))dy--;if(k.has("ArrowDown")||(!two&&k.has("s")))dy++;
      jump=pressed.has(" ")||pressed.has("ArrowUp")||(!two&&pressed.has("w"));fire=pressed.has(" ");
    }
    if(i===1){if(k.has("a"))dx--;if(k.has("d"))dx++;if(k.has("w"))dy--;if(k.has("s"))dy++;jump=pressed.has("w");fire=pressed.has("f");}
    const useMouse=i===0&&c!=="keys"&&mouse.active&&(c==="mouse"||lastInput==="mouse");
    if(i===0&&c!=="keys"&&mouse.clicked){jump=true;fire=true;}
    return {dx,dy,jump,fire,useMouse};
  }
  function hitHero(h,x,y){
    if(h.inv>0||st.over)return;
    h.inv=1.1;poof(x,y,"#FF7B7B");
    if(sp.lives){st.lives--;st.pops.push({x:h.x,y:h.y-30,t:0,s:"-❤️",c:"#FF7B7B"});if(st.lives<=0){end("lose");return;}}
    if(sp.onHit==="stun")h.stun=1;
    if(sp.onHit==="shrink")h.ts=Math.max(.55,h.ts-.15);
    if(sp.onHit==="reset"){reset();st.pops.push({x:W/2,y:H/2,t:0,s:"START OVER!",c:"#FF7B7B"});}
  }
  function caught(h,o,byBullet){
    poof(o.x,o.y,"#FFD166");
    if(sp.coins){st.coins++;st.pops.push({x:o.x,y:o.y-14,t:0,s:"🪙",c:"#FFD166"});}
    const r=sp.onCatch;
    if(r==="score")addScore(h.i,1,o.x,o.y);
    if(r==="grow"){h.ts=Math.min(1.9,h.ts+.12);h.glow=1.4;}
    if(r==="bounce"){
      if(sp.mode==="roam"){o.x=rand(30,W-30);o.y=rand(40,GROUND-30);o.hop=.4;}else{o.vy=-260;o.y-=6;o.grav=1;o.cool=.4;}
      return false;
    }
    if(r==="split"&&byBullet&&o.r>9){for(const s of [-1,1])st.goods.push({x:o.x,y:o.y,vx:s*rand(60,100),vy:0,r:o.r*.65,e:o.e,ph:Math.random()*6});}
    return true;
  }
  function update(dt){
    st.t+=dt;
    for(const p of st.parts){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(!p.sq)p.vy+=180*dt;}
    st.parts=st.parts.filter(p=>p.t<p.life);
    for(const p of st.pops)p.t+=dt;st.pops=st.pops.filter(p=>p.t<.9);
    for(const n of st.npcs){n.t+=dt;if(sp.mode==="roam"){n.x+=n.vx*dt;n.y+=Math.sin(n.t*1.3)*20*dt;}else n.x+=n.vx*dt;if(n.x<20||n.x>W-20)n.vx*=-1;}
    if(st.over){
      st.ot+=dt;const o=sp.outcome;
      const wait=o==="celebrate"?3:o==="endScreen"||o==="leaderboard"?Infinity:1.4;
      if(st.ot>wait||((o==="endScreen"||o==="leaderboard")&&st.ot>.5&&(mouse.clicked||pressed.has(" "))))reset();
      return;
    }
    st.alive+=dt;
    const m=sp.mode,sm=sp.speedUp?1+st.t/30:1,spd=200*(sp.speed||1);
    for(const h of st.heroes){
      const c=ctrl(h.i);
      h.inv=Math.max(0,h.inv-dt);h.glow=Math.max(0,h.glow-dt);h.cd=Math.max(0,h.cd-dt);
      h.scale+=(h.ts-h.scale)*Math.min(1,dt*6);
      const ox=h.x;
      if(h.stun>0){h.stun-=dt;}
      else if(m==="jump"){
        if(c.jump&&h.onGround){h.vy=-430;h.onGround=false;}
      } else {
        if(c.useMouse){h.x+=(mouse.x-h.x)*Math.min(1,dt*9);if(m==="roam")h.y+=(mouse.y-h.y)*Math.min(1,dt*9);}
        else{h.x+=c.dx*spd*dt;if(m==="roam")h.y+=c.dy*spd*dt;}
        if(m==="shoot"&&c.fire&&h.cd<=0){st.bul.push({x:h.x,y:h.y-20,i:h.i});h.cd=.25;}
      }
      h.x+=h.kx*dt;h.kx*=Math.pow(.02,dt);
      if(m==="jump"){h.vy+=1200*dt;h.y+=h.vy*dt;const gy=GROUND-18*h.scale;if(h.y>=gy){h.y=gy;h.vy=0;h.onGround=true;}
        if(sp.bound==="ceiling"&&h.y<70){h.y=70;h.vy=Math.abs(h.vy)*.3;st.pops.push({x:h.x,y:60,t:0,s:"BONK!",c:"#FF7B7B"});}
        if(h.y<16){h.y=16;h.vy=Math.max(0,h.vy);}
      } else {
        const r=h.r*h.scale,b=sp.bound||"clamp";

    }
    // spawning
    st.sg-=dt;st.sh-=dt;st.sb-=dt;
    const item=sp.item||{e:"⭐"};
    if(m==="catch"&&st.sg<=0){st.goods.push({x:rand(20,W-20),y:-16,vy:rand(70,110)*sm,r:14,e:item.e,ph:Math.random()*6});st.sg=.95/sm;}
    if(m==="roam"&&st.goods.length<4&&st.sg<=0){st.goods.push({x:rand(30,W-30),y:rand(40,GROUND-30),r:14,e:item.e,ph:Math.random()*6});st.sg=.8;}
    if(m==="shoot"&&st.goods.length<5&&st.sg<=0){const l=Math.random()<.5;st.goods.push({x:l?-10:W+10,y:rand(40,150),vx:(l?1:-1)*rand(50,90)*sm,r:15,e:item.e,ph:Math.random()*6});st.sg=1.1/sm;}
    if(m==="dodge"&&st.sh<=0){st.hz.push({x:rand(16,W-16),y:-16,vy:rand(110,160)*sm,r:14,e:item.e,spin:rand(-3,3),a:0});st.sh=(sp.dense?.38:.7)/sm;}
    if(m==="jump"&&st.sh<=0){const big=sp.tall?1.5:1;st.hz.push({x:W+20,y:GROUND-14*big,vx:-170*sm,r:14*big,e:item.e,a:0,ground:1});st.sh=rand(1.2,2.1)/sm;}

    }
    // move things
    for(const o of st.goods){
      o.ph+=dt;
      if(o.grav){o.vy+=420*dt;o.cool-=dt;}
      if(o.vy!==undefined)o.y+=o.vy*dt;

      if(o.hop)o.hop=Math.max(0,o.hop-dt);
    }
    st.goods=st.goods.filter(o=>o.y<H+30);
    for(const o of st.hz){o.a+=(o.spin||0)*dt;if(o.vy)o.y+=o.vy*dt;if(o.vx)o.x+=o.vx*dt;

    if(st.enemy){const h=st.heroes[0];const a=Math.atan2(h.y-st.enemy.y,h.x-st.enemy.x),v=55*sm;st.enemy.x+=Math.cos(a)*v*dt;st.enemy.y+=Math.sin(a)*v*dt;}

      g.fillStyle="rgba(0,0,0,.35)";g.beginPath();const sy=sp.mode==="roam"?h.y+sz*.5:GROUND+2;g.ellipse(h.x,sy,sz*.38*(sp.mode==="jump"?Math.max(.4,1-(GROUND-h.y)/220):1),4,0,0,6.28);g.fill();
      if(h.glow>0||h.scale>1.05){const gl=g.createRadialGradient(h.x,h.y,4,h.x,h.y,sz);gl.addColorStop(0,`rgba(255,209,102,${.25+.35*Math.min(1,h.glow)})`);gl.addColorStop(1,"rgba(255,209,102,0)");g.fillStyle=gl;g.beginPath();g.arc(h.x,h.y,sz,0,6.28);g.fill();}

      if(h.stun>0)emoji("💫",h.x,h.y-sz*.7,14,st.t*4);

    }

    for(const p of st.pops){g.globalAlpha=1-p.t/.9;if(/[\u{1F000}-\u{1FFFF}❤]/u.test(p.s))emoji(p.s,p.x,p.y-p.t*30,14);else pix(p.s,p.x,p.y-p.t*30,10,p.c,"center");}g.globalAlpha=1;
    // HUD
    let x=10;const y=10;

    if(sp.timer)pix("⏱"+Math.ceil(st.timer),W-10,y,10,st.timer<6?"#FF7B7B":"#5EE6B8","right");
    else if(sp.survive)pix(st.alive.toFixed(1)+"s",W-10,y,10,"#5EE6B8","right");
    // over screens
    if(st.over){
      const o=sp.outcome,tot=st.score[0]+st.score[1];
      if(o==="endScreen"||o==="leaderboard"){
        g.fillStyle="rgba(10,6,24,.82)";g.fillRect(70,46,W-140,H-92);g.strokeStyle="#FF6B35";g.lineWidth=3;g.strokeRect(70,46,W-140,H-92);
        pix(st.over==="win"?"YOU WIN":"GAME OVER",W/2,64,14,"#FFD166","center");
        pix((sp.pmode==="versus"?`P1 ${st.score[0]} : P2 ${st.score[1]}`:"SCORE "+(hasScore()?tot:sp.coins?st.coins:st.alive.toFixed(1)+"s")),W/2,96,10,"#fff","center");
        if(o==="leaderboard")best.forEach((b,k)=>pix(`${k+1}. ${b}`,W/2,124+k*18,9,k?"#ABA0D2":"#5EE6B8","center"));
        pix("CLICK / SPACE",W/2,H-70,8,"#FF6B35","center");
      } else if(o==="celebrate"){
        pix(st.over==="win"?"YOU WIN!":"SO CLOSE!",W/2,H/2-30,22,st.over==="win"?"#FFD166":"#FF7B7B","center");

  }
  let last=performance.now();

<script>
(function(){

const COLS=[
  {key:"players",en:"PLAYERS",zh:"Players",ic:"👥",tip:"Is this game for one person, or friends too? Do you team up, or compete?",eg:"e.g. two players team up: one uses arrow keys, one uses WASD."},

  {k:["火箭","rocket","ship"],e:"🚀",n:"rocket"},{k:["鱼","fish"],e:"🐟",n:"fish"},{k:["兔","rabbit","bunny"],e:"🐰",n:"bunny"},
  {k:["恐龙","dino"],e:"🦖",n:"dinosaur"},{k:["企鹅","penguin"],e:"🐧",n:"penguin"},{k:["熊猫","panda"],e:"🐼",n:"panda"},
  {k:["青蛙","frog"],e:"🐸",n:"frog"},{k:["外星","alien"],e:"👽",n:"alien"},{k:["鸡","鸟","chick","bird"],e:"🐥",n:"chick"},

  {k:["陨石","meteor","rock","asteroid"],e:"☄️",n:"meteors"},{k:["仙人掌","cactus","cacti"],e:"🌵",n:"cacti"},{k:["箱","box"],e:"📦",n:"boxes"},

  dodge:{k:["躲","dodg","avoid","escape"],def:{e:"☄️",n:"meteors"},obj:n=>"dodge the falling "+n},
  jump:{k:["跳","jump","hop","leap"],def:{e:"🌵",n:"cacti"},obj:n=>"jump over the "+n},

const hasKey=(t,k)=>/^[a-z]/.test(k)?new RegExp("\\b"+k).test(t):t.includes(k);   // English keys match from a word start ("cat" is not in "scatter")

function bestMatch(t,opts){

function parseHero(t){const h=findIn(HEROES,t);const n=t.trim().replace(/^(a|an|the|my)\s+/i,"");return h?{e:h.e,n:n||h.n}:{e:"👾",n:n||"little monster"};}

  const low=t.toLowerCase();

  const it=findIn(ITEMS,t);

}

/* option catalogs per column, given context */
function optionsFor(col,c){

}

  if(pumping)return;pumping=true;renderLive();

function openingFromText(t){

/* a sticker can be rewritten before or after confirming; rewriting turns it red again */

/* ---------- generation, with the gap-revealing prediction ---------- */
/* The prediction question always targets a GAP: something closely tied to what the kid just added,
   but deliberately NOT in the generated code because no sticker says it yet. Playing then reveals the gap. */
const RELATED={character:["rules"],objectives:["rules","outcome"],rules:["outcome","conflict","resources"],procedures:["boundaries","rules"],
  conflict:["resources","rules","outcome"],resources:["outcome","rules"],boundaries:["conflict","outcome"],outcome:["objectives","conflict"],
  players:["rules","outcome"],objectives2:["outcome"]};
function gapQuestion(col,c,t){
  const hero=c.hero.n,it=c.item.n,it1=sing(it);
  return ({
    rules:c.mode==="dodge"?`When a ${it1} hits the ${hero}, what will the game do?`:c.mode==="jump"?`When the ${hero} bumps into a ${it1}, what will the game do?`:c.mode==="shoot"?`When a bubble hits a ${it1}, what will the game do?`:`When the ${hero} catches a ${it1}, what will the game do?`,
    outcome:`With ${/^(this|the new)/.test(t)?t:"“"+t+"”"}, how will the game end?`,
    conflict:`With “${t}”, will anything show up to cause trouble?`,
    resources:`With “${t}”, can the ${hero} run out of lives or time?`,
    boundaries:`If the ${hero} keeps running right, what happens at the edge of the screen?`,
    procedures:`When you play “${t}”, how will you control the ${hero}?`,
    players:`Can you play “${t}” with a friend?`,
    objectives:`With “${t}”, what do you need to do to win?`

function submitGuess(){const g=UI.gen;if(!g||g.guess!==undefined||pumping)return;
  const t=(g.typed||"").trim();
  if(t){g.picked=null;g.guess=t;}else if(g.sel!=null){g.picked=g.sel;g.guess=g.P.a[g.sel].t;}else return;
  say(esc(g.guess),"kid");   // the guess stays in the chat history

/* a guess is phrased as what the kid expects to SEE; none of these are in the game yet */
function guessLabel(o,c){const e=o.e||{},h="the "+c.hero.n,it="the "+sing(c.item.n);
  if(e.onCatch==="score"||e.dodgeScore||e.jumpScore)return "you get 1 point";
  return ({grow:h+" grows and glows",bounce:it+" bounces away",split:it+" splits in two",stun:h+" gets dizzy",shrink:h+" shrinks",reset:"start over"})[e.onCatch||e.onHit]||o.t.replace(/^.*?: /,"");}
function predictionFor(news,c){
  const lit=new Set(P.stickers.filter(s=>s.status==="ok").map(s=>s.col));
  const last=news[news.length-1];
  const src=last.col==="objectives"&&last.effect&&!last.effect.mode?"objectives2":last.col;
  let col=(RELATED[src]||[]).find(k=>!lit.has(k));
  if(!col)col=["rules","outcome","conflict","resources","boundaries","procedures","objectives","players"].find(k=>!lit.has(k));
  if(!col)return {q:`After this change, the ${c.hero.n}'s game will feel…`,a:[{pic:"🔥",t:"more fun"},{pic:"🤔",t:"about the same"}]};
  const raw=last.text.replace(/[“”]/g,"");
  const t=raw.length>24?({rules:"this new rule",conflict:"the new challenge",resources:"the new resource",procedures:"the new controls",boundaries:"the new edges",outcome:"the new ending",players:"the new way to play",character:"the new character",objectives:"the new goal"})[last.col]||"this new idea":raw;
  return {gap:col,q:gapQuestion(col,c,t),a:optionsFor(col,c).map((o,i)=>({pic:o.pic,t:guessLabel(o,c),idx:i})).slice(0,3)};
}


function generate(){
  if(P.phase==="generating")return;
  const news=P.stickers.filter(s=>s.status==="ok"&&!built(s.id));

/* the kid's answer: respond to the feeling first, then reveal the gap, then the directions */
const FEELS=[
  {k:"hard",re:/hard|die|died|dead|lose|lost|too fast|can'?t|annoying|tired|difficult|难|死|输|太快/i,say:"A bit hard, right?"},
  {k:"easy",re:/easy|boring|bored|too slow|simple|no challenge|简单|无聊/i,say:"Too easy, huh?"},
  {k:"fun",re:/fun|cool|awesome|love|like|great|haha|lol|nice|好玩|喜欢/i,say:"Glad it's fun!"}
];
const NOTHING=/nothing|didn'?t|doesn'?t|\bno\b|\bnot\b|never|just|only|disappear|same|没有|没反应|只是|就消失/i;
const MISSING={rules:"what happens when things touch",outcome:"when the game ends",conflict:"what gets in the way",resources:"what can run out",boundaries:"what happens at the edge",procedures:"how to control it",players:"who plays",objectives:"how to win"};
function feelReply(t){
  if(UI.askTimer)clearTimeout(UI.askTimer);UI.asked=true;clearAsk();
  say(esc(t),"kid");
  const lit=new Set(P.stickers.filter(s=>s.status==="ok").map(s=>s.col)),pr=P.prediction;
  const f=FEELS.find(x=>x.re.test(t));P.feel=f?f.k:null;
  let col=null;
  if(pr&&pr.guess&&!lit.has(pr.gap)){
    // the guess didn't happen: say why, then name the concept
    col=pr.gap;
    const o=P.stickers.find(s=>s.col==="objectives"&&s.effect&&s.effect.mode),act=o?o.text.replace(/[“”]/g,""):"this game";
    say(NOTHING.test(t)?"Right!":"Look closer. It doesn't actually happen.");
    var why=`That's because you only said “${esc(act)}”. You didn't say ${MISSING[col]} yet. A computer only does what you tell it clearly.`;
  }else{
    col=Object.keys(COL_WORDS).find(k=>!lit.has(k)&&COL_WORDS[k].some(w=>t.toLowerCase().includes(w)))||(pr&&pr.gap&&!lit.has(pr.gap)&&NOTHING.test(t)?pr.gap:null);
    say(col?"You spotted it!":f?f.say:"Got it!");
  }
  P.found=col;
  const rest=()=>{
  if(why)say(why);
  if(col){const [what,impact]=CONCEPT[col];say(`In games, this is called <b>${COLMAP[col].zh}</b>. ${what} ${impact}`);UI.explained=col;}
  say(pr&&pr.guess&&col===pr.gap?`Want to really put your guess, “${esc(pr.guess)}”, into the game? Or check out other ideas:`:"I've got a few ideas. Want to try one?");
  UI.sel=null;UI.ownText="";P.phase="directions";render();autosave();};
  // first round only: right after the reaction, the "iterating is normal" callout; the robot carries on once it's closed
  if(!P.seen.includes("iterate")&&!UI.onboardQ.includes("iterate")){UI.afterIterate=rest;UI.onboardQ.push("iterate");P.phase="reacting";render();}
  else rest();
}
function directions(){
  const c=ctx(),lit=new Set(P.stickers.filter(s=>s.status==="ok").map(s=>s.col));
  const FEEL_ORDER={hard:["resources","boundaries","procedures"],easy:["conflict","resources","outcome"],fun:["outcome","players","conflict"]};
  const TAG={hard:"make it easier",easy:"add a challenge",fun:"more fun"};
  const base=["rules","outcome","conflict","resources","procedures","boundaries","objectives","players"];
  const card=(k,tag,kind)=>({col:k,ic:COLMAP[k].ic,en:COLMAP[k].en,zh:COLMAP[k].zh,q:questionFor(k,c),why:tag||"",isGap:kind==="gap"||kind==="found"});
  const out=[];const add=(k,tag,kind)=>{if(k&&!lit.has(k)&&!out.some(o=>o.col===k)&&out.length<3)out.push(card(k,tag,kind));};
  const pr=P.prediction;
  if(pr&&pr.guess&&pr.gap&&!lit.has(pr.gap))out.push({col:pr.gap,sel:"guess",q:`Put “${pr.guess}” into the game`,why:""});
  add(P.found,"you found it","found");
  add(pr&&pr.gap,"","gap");
  (FEEL_ORDER[P.feel]||[]).forEach(k=>add(k,TAG[P.feel]));
  base.forEach(k=>add(k));
  for(const k of ["procedures","conflict","rules"]){if(out.length>=3)break;if(out.some(o=>o.col===k))continue;
    out.push({col:k,ic:COLMAP[k].ic,en:COLMAP[k].en,zh:COLMAP[k].zh,q:k==="procedures"?"Do the controls feel good? How would you change them?":k==="conflict"?"What else could make it more challenging?":"What else do you want to happen?",why:""});}
  return out;
}

  if(e.target.matches("[data-edit-text]")){if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();saveEdit(e.target.dataset.editText);}else if(e.key==="Escape"){UI.editing=null;renderBoard();}return;}
  if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-confirm]")){e.preventDefault();confirmSticker(e.target.dataset.confirm);}
  if(e.key==="Escape"){if(UI.menuOpen){UI.menuOpen=false;renderBoard();}else if(UI.boardOpen&&!onboardingOpen){UI.boardOpen=false;renderBoard();}}
});
$("#composer").addEventListener("input",autosize);
document.addEventListener("input",e=>{if(e.target.id==="guessIn"&&UI.gen){UI.gen.typed=e.target.value;if(e.target.value.trim()&&UI.gen.sel!=null){UI.gen.sel=null;document.querySelectorAll(".pchoice.picked").forEach(x=>x.classList.remove("picked"));}
    const b=document.querySelector("[data-act=guess]");if(b)b.disabled=!(UI.gen.sel!=null||e.target.value.trim());return;}
  if(e.target.id!=="ownIdea")return;UI.ownText=e.target.value;if(e.target.value.trim()&&UI.sel){UI.sel=null;document.querySelectorAll(".dir.sel,.chip.on").forEach(x=>x.classList.remove("sel","on"));}
  const b=document.querySelector("[data-act=pickgo]");if(b)b.disabled=!(UI.sel||e.target.value.trim());});
$("#gameName").addEventListener("input",e=>{P.name=e.target.value;P.nameEdited=true;renderSide();$("#paneTitle").textContent=P.name||"My game";});
$("#gameName").addEventListener("change",()=>autosave());

/* ---------- brand logo: token hops at uneven moments at uneven moments ---------- */
document.querySelectorAll("[data-bricks]").forEach(box=>{box.innerHTML=LOGO;});
if(!reduced){const all=[...document.querySelectorAll(".pz")];
  (function go(){const n=Math.random()<.28?2:1;for(let k=0;k<n;k++){const b=all[Math.floor(Math.random()*all.length)];
    b.style.setProperty("--h",(-5-Math.random()*9).toFixed(1)+"px");b.style.setProperty("--r",(Math.random()*30-15).toFixed(0)+"deg");b.style.setProperty("--d",(.32+Math.random()*.4).toFixed(2)+"s");
    b.classList.remove("hop","wig");void b.getBoundingClientRect();b.classList.add(Math.random()<.2?"wig":"hop");}
    setTimeout(go,Math.random()<.3?120+Math.random()*220:450+Math.random()*1500);})();}
/* robot blinks at uneven intervals */
if(!reduced)(function blink(){document.querySelectorAll(".eye").forEach(e=>{e.style.transform="scaleY(.2)";});
  setTimeout(()=>document.querySelectorAll(".eye").forEach(e=>e.style.transform=""),120);setTimeout(blink,1800+Math.random()*3500);})();

/* ---------- boot ---------- */
const game=window.TinkerEngine($("#cv"));
function greet(){
  if(!P.botName){P.phase="naming";say("Hi! I'm your game design robot buddy.");say("But I don't have a name yet. What do you want to call me? Type a name below!");return;}
  say(`Hi! I'm <b>${esc(P.botName)}</b>, your game design buddy.`);
  say("Today we'll make a game you can really play. First, tell me: <b>who</b> is the hero, and what is it <b>doing</b>?");
}
function renameBot(){
  const m=sheet("Rename your buddy","The new name works right away",`<input class="name-in" id="botIn" maxlength="14" value="${esc(botName())}" aria-label="Robot's name"><div class="row"><button class="btn" id="botOk">That's it!</button></div>`);
  const i=m.querySelector("#botIn");i.focus();i.select();
  const ok=()=>{const n=i.value.trim().slice(0,14);if(!n)return;P.botName=n;store.set(BOTKEY,n);m.remove();say(`Sure! From now on, I'm <b>${esc(n)}</b>!`);render();};
  m.querySelector("#botOk").onclick=ok;i.addEventListener("keydown",e=>{if(e.key==="Enter")ok();});
}
render();greet();
})();
</script>
